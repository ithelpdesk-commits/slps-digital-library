<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravi Renewables Travel Desk</title>
<style>
/* Layout: one narrow column, one step on screen at a time, big tap targets for phones. */
:root {
  --bg: #F3F6F2;
  --card: #FFFFFF;
  --fg: #14291E;
  --muted: #5B6B62;
  --accent: #0F6B4F;
  --accent-ink: #FFFFFF;
  --sun: #F2A900;
  --line: #D5E0D9;
  --chip: #E6F0EA;
  --err: #B42318;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1B15; --card: #16271F; --fg: #E7F2EC; --muted: #9DB5A8;
    --accent: #3FBF93; --accent-ink: #0E1B15; --sun: #F2B93B; --line: #2A3F35;
    --chip: #1F3A2E; --err: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1B15; --card: #16271F; --fg: #E7F2EC; --muted: #9DB5A8;
  --accent: #3FBF93; --accent-ink: #0E1B15; --sun: #F2B93B; --line: #2A3F35;
  --chip: #1F3A2E; --err: #FF8A80; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
  overflow-x: hidden;
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
[hidden] { display: none !important; }

.brand { padding: 8px 4px 0; }
.logo { display: block; width: min(100%, 320px); height: auto; margin: 0 0 14px; }
.kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 4px 0 6px; font-size: clamp(28px, 8vw, 34px); line-height: 1.1; text-wrap: balance; }
h2 { margin: 0 0 12px; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.lede, .muted { margin: 0; color: var(--muted); }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px 18px;
  min-width: 0;
}
.crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.crumb strong { color: var(--fg); }

label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
input, select, textarea {
  width: 100%;
  font: inherit;
  font-size: 16px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--fg);
}
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 2px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; margin-top: 18px;
  font: inherit; font-weight: 700; font-size: 16px;
  padding: 14px 18px;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .6; cursor: default; }
.link { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; text-decoration: underline; }

.err { min-height: 1.2em; margin: 8px 0 0; font-size: 14px; color: var(--err); }
.ok { color: var(--accent); font-weight: 700; }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.modes .mode:last-child { grid-column: 1 / -1; }
.mode {
  font: inherit; font-size: 18px; font-weight: 700;
  padding: 22px 12px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  min-height: 72px;
}
.mode:hover, .mode:focus-visible { border-color: var(--accent); }
.mode { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mode svg { width: 40px; height: 40px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.list { display: grid; gap: 10px; margin-top: 14px; }
.pick {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  text-align: left; font: inherit;
  padding: 14px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  min-width: 0;
}
.pick:hover { border-color: var(--accent); }
.pick .title { font-weight: 700; overflow-wrap: anywhere; }
.pick .sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.pick .price { font-weight: 700; color: var(--accent); white-space: nowrap; }

.rec {
  display: grid; gap: 10px;
  padding: 14px; margin-top: 14px;
  border: 1.5px solid var(--accent);
  border-radius: 14px;
  background: var(--chip);
  min-width: 0;
}
.rec-head { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.rec-line { display: grid; gap: 2px; min-width: 0; }
.rec-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.rec-line .title { font-weight: 700; overflow-wrap: anywhere; }
.rec-line .sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.car { display: grid; gap: 10px; }
.car img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; max-width: 100%; background: var(--chip); }
.car-empty {
  padding: 28px 16px; text-align: center; color: var(--muted);
  border: 1.5px dashed var(--line); border-radius: 14px;
}

.summary {
  margin: 0 0 14px; padding: 12px 14px;
  border-radius: 12px; background: var(--chip);
  font-size: 14px; overflow-wrap: anywhere;
}
.fieldrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.fieldrow > div { min-width: 0; }
@media (max-width: 420px) { .fieldrow { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="logo" src="img/logo.svg" alt="Ravi Renewables Travel Desk" width="380" height="80">
    <p class="kicker">Ravi Renewables Pvt Ltd</p>
    <h1>Travel Desk</h1>
    <p class="lede" id="lede">Start with your name or designation.</p>
  </header>

  <!-- Step 1: who is travelling -->
  <section class="card" id="s-who">
    <form id="whoForm" novalidate>
      <label for="who">Name or designation</label>
      <input id="who" type="text" maxlength="80" autocomplete="name" placeholder="e.g. Devendra Rathi, VP Finance">
      <p class="err" id="whoErr" role="alert"></p>
      <button class="btn primary" type="submit">Continue</button>
    </form>
  </section>

  <!-- Step 2: choose mode -->
  <section class="card" id="s-mode" hidden>
    <div class="crumb">
      <span>Traveller: <strong data-who></strong></span>
      <button class="link" type="button" data-goto="s-who">Change</button>
    </div>
    <h2>How are you travelling?</h2>
    <div class="modes">
      <button class="mode" type="button" data-mode="car"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2-6h14l2 6v5h-2v2h-3v-2H8v2H5v-2H3z"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></svg><span>Car</span></button>
      <button class="mode" type="button" data-mode="train"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 11h14M9 19l-2 3M15 19l2 3"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg><span>Train</span></button>
      <button class="mode" type="button" data-mode="flight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16l9-2 4-8h2l-1 8 6 2v2l-6-1-1 4h-2l-1-4-6 1z"/></svg><span>Flight</span></button>
      <button class="mode" type="button" data-mode="cab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2-5h12l2 5v5H4z"/><path d="M9 8V5h6v3"/><circle cx="7.5" cy="16" r="1.2"/><circle cx="16.5" cy="16" r="1.2"/></svg><span>Cab</span></button>
      <button class="mode" type="button" data-mode="other"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Other</span></button>
    </div>
  </section>

  <!-- Step 3a: car fleet -->
  <section class="card" id="s-car" hidden>
    <div class="crumb"><button class="link" type="button" data-goto="s-mode">Back</button></div>
    <h2>Choose a vehicle</h2>
    <div id="carGrid" class="list car"></div>
  </section>

  <!-- Step 3b: train search -->
  <section class="card" id="s-train" hidden>
    <div class="crumb"><button class="link" type="button" data-goto="s-mode">Back</button></div>
    <h2>Where do you want to go?</h2>
    <form id="trainForm" novalidate>
      <label for="tFrom">From</label>
      <input id="tFrom" type="text" maxlength="60" placeholder="e.g. Ghaziabad">
      <label for="tTo">To</label>
      <input id="tTo" type="text" maxlength="60" placeholder="e.g. Pune">
      <label for="tDate">Travel date</label>
      <input id="tDate" type="date">
      <p class="err" id="trainErr" role="alert"></p>
      <button class="btn primary" type="submit">Find trains</button>
    </form>
    <div id="trainList" class="list"></div>
  </section>

  <!-- Step 4: train billing, sent to WhatsApp group -->
  <section class="card" id="s-billing" hidden>
    <div class="crumb"><button class="link" type="button" data-goto="s-train">Back to trains</button></div>
    <h2>Billing details</h2>
    <p class="summary" id="trainSummary"></p>
    <form id="billingForm" novalidate>
      <label for="bEntity">Bill to</label>
      <select id="bEntity">
        <option>Ravi Renewables Pvt Ltd</option>
        <option>Other</option>
      </select>
      <div class="fieldrow">
        <div>
          <label for="bGst">GST number</label>
          <input id="bGst" type="text" maxlength="20" placeholder="Optional">
        </div>
        <div>
          <label for="bCost">Cost centre</label>
          <input id="bCost" type="text" maxlength="60">
        </div>
      </div>
      <div class="fieldrow">
        <div>
          <label for="bDate">Travel date</label>
          <input id="bDate" type="date" required>
        </div>
        <div>
          <label for="bPax">Passengers</label>
          <input id="bPax" type="number" min="1" max="10" value="1" required>
        </div>
      </div>
      <label for="bNotes">Notes</label>
      <textarea id="bNotes" maxlength="300"></textarea>
      <p class="err" id="billingErr" role="alert"></p>
      <button class="btn primary" type="submit">Send to WhatsApp group</button>
    </form>
  </section>

  <!-- Step 3c: details for flight, cab, other, and car -->
  <section class="card" id="s-details" hidden>
    <div class="crumb"><button class="link" type="button" data-goto="s-mode">Back</button></div>
    <h2 id="detailsTitle"></h2>
    <form id="detailsForm" novalidate>
      <div id="detailsFields"></div>
      <p class="err" id="detailsErr" role="alert"></p>
      <button class="btn primary" type="submit" id="detailsSubmit">Send request</button>
    </form>
  </section>

  <!-- Done -->
  <section class="card" id="s-done" hidden>
    <h2>Request sent</h2>
    <p class="ok">The travel desk has your request.</p>
    <button class="btn" type="button" id="again">Make another request</button>
  </section>
</main>

<script>
(function () {
  // ---- Settings: edit these ----
  // ntfy topic that receives car, flight, cab and other requests. Subscribe to it in the ntfy app.
  var TRAVEL_TOPIC = 'ravi-travel-desk-8162d6ad';

  // Vehicles the company uses. Add one entry per vehicle: name, seats, fuel, reg, photo (file in the repo, e.g. "cars/swift.jpg").
  var CARS = [
    { name: 'Swift' },
    { name: 'Innova Crysta' }
  ];

  // Train options. Add one entry per train: no, name, from, to, dep (departure time), dur (journey time in minutes), fare (number, in rupees).
  var TRAINS = [];

  var VEHICLE_OPTS = ['Cab', 'Personal car', 'Personal bike', 'Other'];
  var FIELDS = {
    flight: [
      { id: 'from', label: 'From city', type: 'text', req: true },
      { id: 'to', label: 'To city', type: 'text', req: true },
      { id: 'date', label: 'Travel date', type: 'date', req: true },
      { id: 'time', label: 'Preferred time', type: 'time' },
      { id: 'notes', label: 'Notes (airline, bags, seat)', type: 'textarea' }
    ],
    car: [
      { id: 'from', label: 'Pick-up place', type: 'text', req: true },
      { id: 'to', label: 'Drop place', type: 'text', req: true },
      { id: 'date', label: 'Date', type: 'date', req: true },
      { id: 'time', label: 'Time', type: 'time', req: true }
    ],
    vehicle: [
      { id: 'vtype', label: 'Vehicle type', type: 'select', opts: VEHICLE_OPTS, req: true },
      { id: 'owner', label: 'Driver or owner name', type: 'text', req: true },
      { id: 'contact', label: 'Contact number', type: 'tel', req: true },
      { id: 'vno', label: 'Vehicle number', type: 'text', req: true },
      { id: 'from', label: 'Pick-up place', type: 'text', req: true },
      { id: 'to', label: 'Drop place', type: 'text', req: true },
      { id: 'date', label: 'Date', type: 'date', req: true },
      { id: 'time', label: 'Time', type: 'time', req: true }
    ],
    other: [
      { id: 'desc', label: 'Describe the trip', type: 'textarea', req: true },
      { id: 'date', label: 'Date', type: 'date', req: true }
    ]
  };
  var MODE_LABEL = { car: 'Car', train: 'Train', flight: 'Flight', cab: 'Cab', other: 'Other' };
  var LEDE = {
    's-who': 'Start with your name or designation.',
    's-mode': 'Pick how you are travelling.',
    's-car': 'Pick a vehicle for your trip.',
    's-train': 'Find trains from cheapest to most expensive.',
    's-billing': 'Add billing details, then send to the WhatsApp group.',
    's-details': 'Fill in the details and send.',
    's-done': 'Thank you.'
  };

  var state = { who: '', mode: '', car: null, train: null };

  function $(id) { return document.getElementById(id); }
  function rupees(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

  function show(id) {
    var sections = document.querySelectorAll('main > section');
    for (var i = 0; i < sections.length; i++) {
      sections[i].hidden = sections[i].id !== id;
    }
    $('lede').textContent = LEDE[id] || '';
    window.scrollTo(0, 0);
  }

  function setWho() {
    var els = document.querySelectorAll('[data-who]');
    for (var i = 0; i < els.length; i++) els[i].textContent = state.who;
  }

  // Back and navigation buttons
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]');
    if (g) show(g.getAttribute('data-goto'));
  });

  // Step 1
  $('whoForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('who').value.trim();
    if (!v) {
      $('whoErr').textContent = 'Please type your name or designation.';
      $('who').focus();
      return;
    }
    $('whoErr').textContent = '';
    state.who = v;
    setWho();
    show('s-mode');
  });

  // Step 2
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.mode = b.getAttribute('data-mode');
      state.car = null;
      state.train = null;
      if (state.mode === 'car') {
        renderCars();
        show('s-car');
      } else if (state.mode === 'train') {
        show('s-train');
      } else {
        buildDetails(state.mode, MODE_LABEL[state.mode] + ' request', FIELDS[state.mode === 'flight' ? 'flight' : 'vehicle']);
      }
    });
  });

  // Step 3a: car fleet
  function renderCars() {
    var grid = $('carGrid');
    grid.textContent = '';
    if (!CARS.length) {
      var empty = document.createElement('p');
      empty.className = 'car-empty';
      empty.textContent = 'Our vehicle list is being added. Please check back soon, or choose Cab or Other.';
      grid.appendChild(empty);
      return;
    }
    CARS.forEach(function (c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pick';
      var t = document.createElement('span');
      t.className = 'title';
      t.textContent = c.name;
      var s = document.createElement('span');
      s.className = 'sub';
      s.textContent = [c.seats ? c.seats + ' seats' : '', c.fuel || '', c.reg || ''].filter(Boolean).join(' · ');
      btn.appendChild(t);
      btn.appendChild(s);
      if (c.photo) {
        var img = document.createElement('img');
        img.src = c.photo;
        img.alt = c.name;
        img.loading = 'lazy';
        img.style.gridColumn = '1 / -1';
        btn.appendChild(img);
      }
      btn.addEventListener('click', function () {
        state.car = c;
        buildDetails('car', 'Car: ' + c.name, FIELDS.car);
      });
      grid.appendChild(btn);
    });
  }

  // Step 3b: trains, cheapest first
  $('trainForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var from = $('tFrom').value.trim().toLowerCase();
    var to = $('tTo').value.trim().toLowerCase();
    if (!to) {
      $('trainErr').textContent = 'Please type where you want to go.';
      $('tTo').focus();
      return;
    }
    $('trainErr').textContent = '';
    var found = TRAINS.filter(function (t) {
      return t.to.toLowerCase().indexOf(to) !== -1 && (!from || t.from.toLowerCase().indexOf(from) !== -1);
    }).sort(function (a, b) { return a.fare - b.fare; });

    var list = $('trainList');
    list.textContent = '';
    if (!TRAINS.length) {
      var none = document.createElement('p');
      none.className = 'car-empty';
      none.textContent = 'Train options are not loaded yet. Please ask the travel desk.';
      list.appendChild(none);
      return;
    }
    if (!found.length) {
      var nf = document.createElement('p');
      nf.className = 'car-empty';
      nf.textContent = 'No trains found for that route.';
      list.appendChild(nf);
      return;
    }
    // Recommendation: fastest train, and the cheapest fare (shortest time breaks a tie)
    var fastest = found.reduce(function (a, b) { return b.dur < a.dur ? b : a; });
    var cheapest = found.reduce(function (a, b) {
      if (b.fare !== a.fare) return b.fare < a.fare ? b : a;
      return b.dur < a.dur ? b : a;
    });
    var rec = document.createElement('div');
    rec.className = 'rec';
    var h = document.createElement('p');
    h.className = 'rec-head';
    h.textContent = 'Our recommendation';
    rec.appendChild(h);
    if (fastest === cheapest) {
      rec.appendChild(recLine('Fastest and most cost-effective', fastest));
    } else {
      rec.appendChild(recLine('Fastest', fastest));
      rec.appendChild(recLine('Most cost-effective', cheapest));
    }
    list.appendChild(rec);

    found.forEach(function (t) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pick';
      var title = document.createElement('span');
      title.className = 'title';
      title.textContent = t.name + ' (' + t.no + ')';
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = t.from + ' to ' + t.to + ' · departs ' + t.dep + ' · ' + fmtDur(t.dur);
      var price = document.createElement('span');
      price.className = 'price';
      price.textContent = rupees(t.fare);
      btn.appendChild(title);
      btn.appendChild(sub);
      btn.appendChild(price);
      btn.addEventListener('click', function () { chooseTrain(t); });
      list.appendChild(btn);
    });
  });

  function fmtDur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + 'h ' : '') + (m ? m + 'm' : '').trim();
  }

  function recLine(label, t) {
    var wrap = document.createElement('div');
    wrap.className = 'rec-line';
    var k = document.createElement('span');
    k.className = 'rec-label';
    k.textContent = label;
    var title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.name + ' (' + t.no + ')';
    var sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = t.dep + ' departure · ' + fmtDur(t.dur) + ' · ' + rupees(t.fare);
    wrap.appendChild(k);
    wrap.appendChild(title);
    wrap.appendChild(sub);
    return wrap;
  }

  function chooseTrain(t) {
    state.train = t;
    $('trainSummary').textContent = t.name + ' (' + t.no + ') · ' + t.from + ' to ' + t.to + ' · departs ' + t.dep + ' · ' + rupees(t.fare);
    if ($('tDate').value) $('bDate').value = $('tDate').value;
    $('billingErr').textContent = '';
    show('s-billing');
  }

  // Step 4: train billing, sent to a WhatsApp group chosen by the traveller
  $('billingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('billingErr');
    err.textContent = '';
    if (!$('bDate').value) { err.textContent = 'Please pick the travel date.'; $('bDate').focus(); return; }
    var pax = parseInt($('bPax').value, 10);
    if (!pax || pax < 1) { err.textContent = 'Please enter the number of passengers.'; $('bPax').focus(); return; }

    var t = state.train;
    var lines = [
      '*Train booking request*',
      'Traveller: ' + state.who,
      'Train: ' + t.name + ' (' + t.no + ')',
      'Route: ' + t.from + ' to ' + t.to,
      'Departs: ' + t.dep,
      'Fare: ' + rupees(t.fare) + ' per passenger',
      'Travel date: ' + $('bDate').value,
      'Passengers: ' + pax,
      '',
      '*Billing*',
      'Bill to: ' + $('bEntity').value,
      'GST: ' + ($('bGst').value.trim() || '-'),
      'Cost centre: ' + ($('bCost').value.trim() || '-')
    ];
    if ($('bNotes').value.trim()) lines.push('Notes: ' + $('bNotes').value.trim());

    // Opens WhatsApp so the traveller picks the group and sends.
    // Also send the booking to ntfy, then open WhatsApp whether or not ntfy answered.
    var waUrl = 'https://wa.me/?text=' + encodeURIComponent(lines.join('\n'));
    var body = lines.join('\n');
    fetch('https://ntfy.sh/' + TRAVEL_TOPIC, {
      method: 'POST',
      headers: { 'Title': 'Travel request: Train', 'Tags': 'train' },
      body: body
    }).catch(function () {}).then(function () {
      window.location.href = waUrl;
    });
  });

  // Step 3c: details form, built from the field list
  function buildDetails(mode, title, fields) {
    state.mode = mode;
    $('detailsTitle').textContent = title;
    $('detailsErr').textContent = '';
    var box = $('detailsFields');
    box.textContent = '';

    var sum = document.createElement('p');
    sum.className = 'summary';
    sum.textContent = 'Traveller: ' + state.who;
    box.appendChild(sum);

    var row = null;
    fields.forEach(function (f) {
      var wrap = document.createElement('div');
      var lab = document.createElement('label');
      lab.htmlFor = 'f-' + f.id;
      lab.textContent = f.label + (f.req ? ' *' : '');
      wrap.appendChild(lab);
      var input;
      if (f.type === 'select') {
        input = document.createElement('select');
        f.opts.forEach(function (o) {
          var op = document.createElement('option');
          op.textContent = o;
          input.appendChild(op);
        });
      } else if (f.type === 'textarea') {
        input = document.createElement('textarea');
        input.maxLength = 300;
      } else {
        input = document.createElement('input');
        input.type = f.type;
        input.maxLength = 80;
      }
      input.id = 'f-' + f.id;
      input.name = f.id;
      if (f.req) input.required = true;
      if (f.id === 'date' || f.id === 'time') { /* native pickers */ }
      wrap.appendChild(input);

      // Put short fields side by side on wide screens
      if (f.type === 'date' || f.type === 'time') {
        if (!row) { row = document.createElement('div'); row.className = 'fieldrow'; box.appendChild(row); }
        row.appendChild(wrap);
        if (row.children.length === 2) row = null;
      } else {
        row = null;
        box.appendChild(wrap);
      }
    });

    $('detailsSubmit').disabled = false;
    show('s-details');
  }

  $('detailsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var fields = [];
    var box = $('detailsFields');
    var inputs = box.querySelectorAll('input, select, textarea');
    var missing = false;
    for (var i = 0; i < inputs.length; i++) {
      var el = inputs[i];
      if (el.required && !el.value.trim()) { missing = true; }
    }
    if (missing) {
      $('detailsErr').textContent = 'Please fill in all fields marked *.';
      return;
    }
    $('detailsErr').textContent = '';

    var mode = state.mode;
    var label = MODE_LABEL[mode] || mode;
    var lines = ['Traveller: ' + state.who, 'Mode: ' + label];
    if (mode === 'car' && state.car) {
      lines.push('Vehicle: ' + state.car.name + (state.car.reg ? ' (' + state.car.reg + ')' : ''));
    }
    for (var j = 0; j < inputs.length; j++) {
      var inp = inputs[j];
      var v = inp.value.trim();
      if (!v) continue;
      var lab = box.querySelector('label[for="' + inp.id + '"]');
      lines.push((lab ? lab.textContent.replace(' *', '') : inp.name) + ': ' + v);
    }
    fields = lines.join('\n');

    var btn = $('detailsSubmit');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    fetch('https://ntfy.sh/' + TRAVEL_TOPIC, {
      method: 'POST',
      headers: { 'Title': 'Travel request: ' + label, 'Tags': 'airplane' },
      body: fields
    }).then(function (res) {
      if (!res.ok) throw new Error('bad status');
      btn.textContent = 'Send request';
      show('s-done');
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = 'Send request';
      $('detailsErr').textContent = 'Could not send. Check your connection and try again.';
    });
  });

  $('again').addEventListener('click', function () {
    state.mode = ''; state.car = null; state.train = null;
    show('s-mode');
  });
})();
</script>
</body>
</html>
